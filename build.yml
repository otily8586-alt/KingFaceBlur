          package com.aliiii.faceblur

          import android.graphics.RectF
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min

          /** mode: 0 بلور، 1 موزاییک، 2 شیشه مات، 3 پارازیت، 4 مشکی
           *  shape: 0 بیضی، 1 دایره، 2 مربع، 3 گوشه‌گرد */
          data class BlurSettings(
              val mode: Int = 0,
              val shape: Int = 0,
              val strength: Float = 0.9f,
              val pad: Float = 0.35f,
              val feather: Float = 0.25f,
              val highAccuracy: Boolean = true,
          )

          data class Pt(val t: Long, val cx: Float, val cy: Float, val w: Float, val h: Float)
          class Track { val pts = ArrayList<Pt>() }

          class FaceTracks(private val tracks: List<Track>) {
              companion object {
                  const val HOLD = 350_000L
                  const val MAX_GAP = 600_000L
              }

              /** خروجی: لیست [cx, cy, w, h] نرمالایز (محور y از بالا) */
              fun boxesAt(tUs: Long): List<FloatArray> {
                  val out = ArrayList<FloatArray>()
                  for (tr in tracks) {
                      val p = tr.pts
                      if (p.isEmpty()) continue
                      if (tUs < p.first().t - HOLD || tUs > p.last().t + HOLD) continue
                      var lo = 0
                      var hi = p.size
                      while (lo < hi) {
                          val m = (lo + hi) ushr 1
                          if (p[m].t < tUs) lo = m + 1 else hi = m
                      }
                      val next = if (lo < p.size) p[lo] else null
                      val prev = if (lo > 0) p[lo - 1] else null
                      val b: FloatArray? = when {
                          prev == null -> next?.let { floatArrayOf(it.cx, it.cy, it.w, it.h) }
                          next == null -> floatArrayOf(prev.cx, prev.cy, prev.w, prev.h)
                          next.t - prev.t <= MAX_GAP -> {
                              val f = if (next.t == prev.t) 0f else (tUs - prev.t).toFloat() / (next.t - prev.t)
                              floatArrayOf(
                                  prev.cx + (next.cx - prev.cx) * f,
                                  prev.cy + (next.cy - prev.cy) * f,
                                  prev.w + (next.w - prev.w) * f,
                                  prev.h + (next.h - prev.h) * f,
                              )
                          }
                          tUs - prev.t <= HOLD -> floatArrayOf(prev.cx, prev.cy, prev.w, prev.h)
                          next.t - tUs <= HOLD -> floatArrayOf(next.cx, next.cy, next.w, next.h)
                          else -> null
                      }
                      if (b != null) out.add(b)
                  }
                  return out
              }
          }

          object Tracker {
              fun build(samples: List<Pair<Long, List<RectF>>>): FaceTracks {
                  val all = ArrayList<Track>()
                  val active = ArrayList<Track>()
                  val lastIdx = HashMap<Track, Int>()
                  for ((i, s) in samples.withIndex()) {
                      val t = s.first
                      val used = HashSet<Track>()
                      for (d in s.second.sortedByDescending { it.width() * it.height() }) {
                          val cx = d.centerX(); val cy = d.centerY(); val w = d.width(); val h = d.height()
                          var best: Track? = null
                          var bestDist = Float.MAX_VALUE
                          for (tr in active) {
                              if (tr in used) continue
                              val gap = i - (lastIdx[tr] ?: continue)
                              if (gap > 8) continue
                              val l = tr.pts.last()
                              val dist = hypot(cx - l.cx, cy - l.cy)
                              val lim = max(max(w, h), max(l.w, l.h)) * 0.8f * (1f + 0.3f * gap)
                              if (dist < lim && dist < bestDist) { best = tr; bestDist = dist }
                          }
                          if (best == null) {
                              best = Track(); all.add(best); active.add(best)
                              best.pts.add(Pt(t, cx, cy, w, h))
                          } else {
                              val l = best.pts.last()
                              val a = 0.65f
                              best.pts.add(Pt(t, a * cx + (1 - a) * l.cx, a * cy + (1 - a) * l.cy,
                                  a * w + (1 - a) * l.w, a * h + (1 - a) * l.h))
                          }
                          lastIdx[best] = i
                          used.add(best)
                      }
                      active.removeAll { i - (lastIdx[it] ?: 0) > 8 }
                  }
                  return FaceTracks(all)
              }

              fun iou(a: RectF, b: RectF): Float {
                  val l = max(a.left, b.left); val t = max(a.top, b.top)
                  val r = min(a.right, b.right); val bt = min(a.bottom, b.bottom)
                  val inter = max(0f, r - l) * max(0f, bt - t)
                  val u = a.width() * a.height() + b.width() * b.height() - inter
                  return if (u <= 0f) 0f else inter / u
              }

              fun overlapMin(a: RectF, b: RectF): Float {
                  val l = max(a.left, b.left); val t = max(a.top, b.top)
                  val r = min(a.right, b.right); val bt = min(a.bottom, b.bottom)
                  val inter = max(0f, r - l) * max(0f, bt - t)
                  val m = min(a.width() * a.height(), b.width() * b.height())
                  return if (m <= 0f) 0f else inter / m
              }
          }
          ENDOFFILE_5
          mkdir -p "$(dirname 'app/src/main/java/com/aliiii/faceblur/Detector.kt')"
          cat > 'app/src/main/java/com/aliiii/faceblur/Detector.kt' <<'ENDOFFILE_6'
          package com.aliiii.faceblur

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.RectF
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.facedetector.FaceDetector
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.ensureActive
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.coroutines.coroutineContext

          object Detector {
              private const val MODEL_URL =
                  "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
              private const val STEP_US = 100_000L   // هر ۰.۱ ثانیه یک بار تشخیص
              private const val MAX_SIDE = 960

              private fun modelFile(ctx: Context) = File(ctx.filesDir, "blaze_face_short_range.tflite")

              suspend fun ensureModel(ctx: Context): File = withContext(Dispatchers.IO) {
                  val f = modelFile(ctx)
                  if (f.exists() && f.length() > 100_000) return@withContext f
                  val tmp = File(f.path + ".tmp")
                  URL(MODEL_URL).openStream().use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                  tmp.renameTo(f)
                  f
              }

              suspend fun scan(
                  ctx: Context, uri: Uri, highAccuracy: Boolean, onProgress: (Float) -> Unit,
              ): FaceTracks = withContext(Dispatchers.Default) {
                  val bytes = modelFile(ctx).readBytes()
                  val buf = ByteBuffer.allocateDirect(bytes.size).order(ByteOrder.nativeOrder())
                  buf.put(bytes); buf.rewind()
                  val opts = FaceDetector.FaceDetectorOptions.builder()
                      .setBaseOptions(BaseOptions.builder().setModelAssetBuffer(buf).build())
                      .setRunningMode(RunningMode.IMAGE)
                      .setMinDetectionConfidence(0.35f)
                      .build()
                  val det = FaceDetector.createFromOptions(ctx, opts)
                  val mmr = MediaMetadataRetriever()
                  try {
                      mmr.setDataSource(ctx, uri)
                      val durUs = (mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L) * 1000L
                      var vw = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 1280
                      var vh = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull() ?: 720
                      val rot = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_ROTATION)?.toIntOrNull() ?: 0
                      if (rot == 90 || rot == 270) { val x = vw; vw = vh; vh = x }
                      val sc = MAX_SIDE.toFloat() / maxOf(vw, vh)
                      val tw = (vw * sc).toInt().coerceAtLeast(64)
                      val th = (vh * sc).toInt().coerceAtLeast(64)

                      val regions = ArrayList<FloatArray>()
                      regions.add(floatArrayOf(0f, 0f, 1f, 1f))
                      if (highAccuracy) {
                          regions.add(floatArrayOf(0f, 0f, .6f, .6f)); regions.add(floatArrayOf(.4f, 0f, 1f, .6f))
                          regions.add(floatArrayOf(0f, .4f, .6f, 1f)); regions.add(floatArrayOf(.4f, .4f, 1f, 1f))
                      }

                      val samples = ArrayList<Pair<Long, List<RectF>>>()
                      var t = 0L
                      while (t <= durUs) {
                          coroutineContext.ensureActive()
                          var frame: Bitmap? = try {
                              mmr.getScaledFrameAtTime(t, MediaMetadataRetriever.OPTION_CLOSEST, tw, th)
                          } catch (e: Exception) { null }
                          if (frame == null) frame = mmr.getFrameAtTime(t, MediaMetadataRetriever.OPTION_CLOSEST)
                          if (frame != null) {
                              if (frame.config != Bitmap.Config.ARGB_8888) frame = frame.copy(Bitmap.Config.ARGB_8888, false)
                              samples.add(t to detectFrame(det, frame!!, regions))
                          }
                          onProgress(if (durUs > 0) (t.toFloat() / durUs).coerceIn(0f, 1f) else 1f)
                          t += STEP_US
                      }
                      Tracker.build(samples)
                  } finally {
                      det.close()
                      mmr.release()
                  }
              }

              private fun detectFrame(det: FaceDetector, bmp: Bitmap, regions: List<FloatArray>): List<RectF> {
                  val found = ArrayList<Pair<Float, RectF>>()
                  val W = bmp.width; val H = bmp.height
                  for (r in regions) {
                      val x0 = (r[0] * W).toInt(); val y0 = (r[1] * H).toInt()
                      val x1 = (r[2] * W).toInt(); val y1 = (r[3] * H).toInt()
                      val cw = (x1 - x0).coerceAtLeast(1); val ch = (y1 - y0).coerceAtLeast(1)
                      val crop = if (cw == W && ch == H) bmp else Bitmap.createBitmap(bmp, x0, y0, cw, ch)
                      val res = det.detect(BitmapImageBuilder(crop).build())
                      for (d in res.detections()) {
                          val bb = d.boundingBox()
                          val score = d.categories().firstOrNull()?.score() ?: 0f
                          val rect = RectF(
                              ((x0 + bb.left) / W).coerceIn(0f, 1f), ((y0 + bb.top) / H).coerceIn(0f, 1f),
                              ((x0 + bb.right) / W).coerceIn(0f, 1f), ((y0 + bb.bottom) / H).coerceIn(0f, 1f),
                          )
                          if (rect.width() > 0.005f && rect.height() > 0.005f) found.add(score to rect)
                      }
                      if (crop !== bmp) crop.recycle()
                  }
                  // NMS
                  found.sortByDescending { it.first }
                  val keep = ArrayList<RectF>()
                  for ((_, rc) in found) {
                      if (keep.none { Tracker.iou(it, rc) > 0.3f || Tracker.overlapMin(it, rc) > 0.7f }) keep.add(rc)
                  }
                  return keep
              }
          }
          ENDOFFILE_6
          mkdir -p "$(dirname 'app/src/main/java/com/aliiii/faceblur/BlurEffect.kt')"
          cat > 'app/src/main/java/com/aliiii/faceblur/BlurEffect.kt' <<'ENDOFFILE_7'
          @file:OptIn(UnstableApi::class)

          package com.aliiii.faceblur

          import android.content.Context
          import android.opengl.GLES20
          import androidx.media3.common.VideoFrameProcessingException
          import androidx.media3.common.util.GlProgram
          import androidx.media3.common.util.GlUtil
          import androidx.media3.common.util.Size
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.BaseGlShaderProgram
          import androidx.media3.effect.GlEffect
          import androidx.media3.effect.GlShaderProgram

          /** اگر بلور وارونه (بالا/پایین) افتاد، این را false کن */
          private const val FLIP_Y = true
          private const val MAX_BOXES = 8

          class FaceBlurEffect(private val tracks: FaceTracks, private val s: BlurSettings) : GlEffect {
              override fun toGlShaderProgram(context: Context, useHdr: Boolean): GlShaderProgram =
                  FaceBlurProgram(tracks, s, useHdr)
          }

          class FaceBlurProgram(
              private val tracks: FaceTracks,
              private val s: BlurSettings,
              useHdr: Boolean,
          ) : BaseGlShaderProgram(useHdr, 1) {

              private val program: GlProgram
              private var w = 1
              private var h = 1

              init {
                  try {
                      program = GlProgram(VERTEX, buildFragment())
                      program.setBufferAttribute(
                          "aFramePosition",
                          GlUtil.getNormalizedCoordinateBounds(),
                          GlUtil.HOMOGENEOUS_COORDINATE_VECTOR_SIZE,
                      )
                  } catch (e: GlUtil.GlException) {
                      throw VideoFrameProcessingException(e)
                  }
              }

              override fun configure(inputWidth: Int, inputHeight: Int): Size {
                  w = inputWidth; h = inputHeight
                  return Size(inputWidth, inputHeight)
              }

              override fun drawFrame(inputTexId: Int, presentationTimeUs: Long) {
                  try {
                      program.use()
                      program.setSamplerTexIdUniform("uTexSampler", inputTexId, false)
                      program.setFloatsUniform("uSize", floatArrayOf(w.toFloat(), h.toFloat()))
                      program.setFloatUniform("uMode", s.mode.toFloat())
                      program.setFloatUniform("uShape", s.shape.toFloat())
                      program.setFloatUniform("uStrength", s.strength)
                      program.setFloatUniform("uFeather", s.feather)
                      program.setFloatUniform("uTime", presentationTimeUs / 1_000_000f)

                      val boxes = tracks.boxesAt(presentationTimeUs).sortedByDescending { it[2] * it[3] }.take(MAX_BOXES)
                      for (i in 0 until MAX_BOXES) {
                          val b = boxes.getOrNull(i)
                          val v = if (b == null) floatArrayOf(0f, 0f, 0f, 0f) else {
                              val bw = b[2] * (1f + s.pad)
                              val bh = b[3] * (1f + s.pad)
                              val cy = if (FLIP_Y) 1f - b[1] else b[1]
                              floatArrayOf(b[0] * w, cy * h, bw * w / 2f, bh * h / 2f)
                          }
                          program.setFloatsUniform("uBox$i", v)
                      }
                      program.bindAttributesAndUniforms()
                      GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
                  } catch (e: GlUtil.GlException) {
                      throw VideoFrameProcessingException(e, presentationTimeUs)
                  }
              }

              override fun release() {
                  super.release()
                  try { program.delete() } catch (e: GlUtil.GlException) { throw VideoFrameProcessingException(e) }
              }

              companion object {
                  private const val VERTEX = """
          attribute vec4 aFramePosition;
          varying vec2 vUv;
          void main() {
            gl_Position = aFramePosition;
            vUv = aFramePosition.xy * 0.5 + 0.5;
          }
          """

                  private fun buildFragment(): String {
                      val sb = StringBuilder()
                      sb.append("""
          precision highp float;
          uniform sampler2D uTexSampler;
          varying vec2 vUv;
          uniform vec2 uSize;
          uniform float uMode;
          uniform float uShape;
          uniform float uStrength;
          uniform float uFeather;
          uniform float uTime;
          """)
                      for (i in 0 until MAX_BOXES) sb.append("uniform vec4 uBox$i;\n")
                      sb.append("""
          float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

          float sdf(vec2 p, vec4 b) {
            vec2 q = p - b.xy;
            vec2 h = b.zw;
            if (uShape < 0.5) {
              return (length(q / h) - 1.0) * min(h.x, h.y);
            } else if (uShape < 1.5) {
              return length(q) - max(h.x, h.y);
            } else if (uShape < 2.5) {
              vec2 d = abs(q) - h;
              return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
            } else {
              float r = min(h.x, h.y) * 0.45;
              vec2 d = abs(q) - h + r;
              return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;
            }
          }

          vec3 blurAt(vec2 p, float radius) {
            vec3 acc = texture2D(uTexSampler, vUv).rgb;
            float wsum = 1.0;
            float rot = hash(p) * 6.2831853;
            for (int i = 1; i <= 64; i++) {
              float fi = float(i);
              float r = sqrt(fi / 64.0);
              float a = fi * 2.39996323 + rot;
              vec2 o = vec2(cos(a), sin(a)) * r * radius;
              float wt = exp(-r * r * 1.5);
              acc += texture2D(uTexSampler, vUv + o / uSize).rgb * wt;
              wsum += wt;
            }
            return acc / wsum;
          }

          vec3 effectColor(vec2 p, vec2 bh) {
            float m = min(bh.x, bh.y);
            float t = floor(uTime * 20.0);
            if (uMode < 0.5) {
              return blurAt(p, uStrength * m * 0.55);
            } else if (uMode < 1.5) {
              float blk = max(4.0, m * 0.30 * uStrength);
              vec2 c = (floor(p / blk) + 0.5) * blk;
              return texture2D(uTexSampler, c / uSize).rgb;
            } else if (uMode < 2.5) {
              vec3 b = blurAt(p, uStrength * m * 0.40);
              float n = hash(p + vec2(t, t * 1.3)) - 0.5;
              return clamp(b + vec3(n * 0.22), 0.0, 1.0);
            } else if (uMode < 3.5) {
              vec2 g = floor(p / 3.0);
              vec3 n = vec3(hash(g + vec2(t, 1.0)), hash(g + vec2(t, 7.0)), hash(g + vec2(t, 13.0)));
              float band = step(0.85, hash(vec2(floor(p.y / 6.0), t)));
              vec3 b = blurAt(p, m * 0.5);
              return mix(b * 0.25, n, 0.75 + 0.25 * band);
            } else {
              return vec3(0.0);
            }
          }

          void main() {
            vec4 base = texture2D(uTexSampler, vUv);
            vec2 p = vUv * uSize;
            float best = 0.0;
            vec2 bh = vec2(1.0);
          """)
                      for (i in 0 until MAX_BOXES) {
                          sb.append("""
            if (uBox$i.z > 0.0) {
              float d = sdf(p, uBox$i);
              float f = max(1.0, uFeather * min(uBox$i.z, uBox$i.w));
              float mk = 1.0 - smoothstep(-f, f, d);
              if (mk > best) { best = mk; bh = uBox$i.zw; }
            }
          """)
                      }
                      sb.append("""
            if (best <= 0.0) { gl_FragColor = base; return; }
            vec3 fx = effectColor(p, bh);
            gl_FragColor = vec4(mix(base.rgb, fx, best), base.a);
          }
          """)
                      return sb.toString()
                  }
              }
          }
          ENDOFFILE_7
          mkdir -p "$(dirname 'app/src/main/java/com/aliiii/faceblur/Exporter.kt')"
          cat > 'app/src/main/java/com/aliiii/faceblur/Exporter.kt' <<'ENDOFFILE_8'
          @file:OptIn(UnstableApi::class)

          package com.aliiii.faceblur

          import android.content.ContentValues
          import android.content.Context
          import android.media.MediaCodecInfo
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Environment
          import android.provider.MediaStore
          import androidx.media3.common.Effect
          import androidx.media3.common.MediaItem
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.DefaultEncoderFactory
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.Effects
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.ProgressHolder
          import androidx.media3.transformer.Transformer
          import androidx.media3.transformer.VideoEncoderSettings
          import kotlinx.coroutines.CompletableDeferred
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          object Exporter {

              /** باید روی Main thread صدا زده شود. */
              suspend fun export(
                  ctx: Context, uri: Uri, tracks: FaceTracks, s: BlurSettings, out: File,
                  onProgress: (Float) -> Unit,
              ) = coroutineScope {
                  val mmr = MediaMetadataRetriever()
                  var srcBitrate = 8_000_000
                  try {
                      mmr.setDataSource(ctx, uri)
                      srcBitrate = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_BITRATE)?.toIntOrNull() ?: srcBitrate
                  } finally { mmr.release() }
                  val target = (srcBitrate * 1.3).toInt().coerceIn(6_000_000, 50_000_000)

                  val encoder = DefaultEncoderFactory.Builder(ctx)
                      .setRequestedVideoEncoderSettings(
                          VideoEncoderSettings.Builder()
                              .setBitrate(target)
                              .setBitrateMode(MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR)
                              .build()
                      )
                      .setEnableFallback(true)
                      .build()

                  val videoEffects = listOf<Effect>(FaceBlurEffect(tracks, s))
                  val item = EditedMediaItem.Builder(MediaItem.fromUri(uri))
                      .setEffects(Effects(listOf<AudioProcessor>(), videoEffects))
                      .build()

                  val done = CompletableDeferred<Unit>()
                  val transformer = Transformer.Builder(ctx)
                      .setEncoderFactory(encoder)
                      .addListener(object : Transformer.Listener {
                          override fun onCompleted(composition: Composition, exportResult: ExportResult) {
                              done.complete(Unit)
                          }
                          override fun onError(composition: Composition, exportResult: ExportResult, exportException: ExportException) {
                              done.completeExceptionally(exportException)
                          }
                      })
                      .build()

                  transformer.start(item, out.absolutePath)
                  val poll = launch {
                      val holder = ProgressHolder()
                      while (true) {
                          if (transformer.getProgress(holder) == Transformer.PROGRESS_STATE_AVAILABLE) {
                              onProgress(holder.progress / 100f)
                          }
                          delay(300)
                      }
                  }
                  try {
                      done.await()
                  } finally {
                      poll.cancel()
                      if (!done.isCompleted) transformer.cancel()
                  }
              }

              suspend fun saveToGallery(ctx: Context, file: File): Uri = withContext(Dispatchers.IO) {
                  val resolver = ctx.contentResolver
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, "FaceBlur_${System.currentTimeMillis()}.mp4")
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/FaceBlur")
                      put(MediaStore.Video.Media.IS_PENDING, 1)
                  }
                  val dst = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                      ?: throw IllegalStateException("ذخیره در گالری ممکن نشد")
                  resolver.openOutputStream(dst)!!.use { o -> file.inputStream().use { it.copyTo(o) } }
                  values.clear()
                  values.put(MediaStore.Video.Media.IS_PENDING, 0)
                  resolver.update(dst, values, null, null)
                  file.delete()
                  dst
              }
          }
          ENDOFFILE_8
          mkdir -p "$(dirname 'app/src/main/java/com/aliiii/faceblur/MainActivity.kt')"
          cat > 'app/src/main/java/com/aliiii/faceblur/MainActivity.kt' <<'ENDOFFILE_9'
          package com.aliiii.faceblur

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContent {
                      MaterialTheme {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              Surface(Modifier.fillMaxSize()) { App() }
                          }
                      }
                  }
              }
          }

          suspend fun process(
              ctx: Context, uri: Uri, s: BlurSettings,
              status: (String) -> Unit, progress: (Float) -> Unit,
          ): Uri {
              status("آماده‌سازی مدل تشخیص چهره (بار اول دانلود می‌شود)…")
              Detector.ensureModel(ctx)
              status("پیدا کردن و ردیابی چهره‌ها…")
              val tracks = Detector.scan(ctx, uri, s.highAccuracy) { progress(it * 0.5f) }
              status("ساخت ویدیوی نهایی با کیفیت بالا…")
              val out = File(ctx.cacheDir, "blur_${System.currentTimeMillis()}.mp4")
              withContext(Dispatchers.Main) {
                  Exporter.export(ctx, uri, tracks, s, out) { progress(0.5f + it * 0.5f) }
              }
              status("ذخیره در گالری…")
              return Exporter.saveToGallery(ctx, out)
          }

          @Composable
          fun ChipRow(title: String, items: List<String>, sel: Int, enabled: Boolean, onSel: (Int) -> Unit) {
              Text(title, style = MaterialTheme.typography.titleSmall)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  items.forEachIndexed { i, l ->
                      FilterChip(selected = i == sel, onClick = { onSel(i) }, label = { Text(l) }, enabled = enabled)
                  }
              }
          }

          @Composable
          fun LabeledSlider(title: String, value: Float, range: ClosedFloatingPointRange<Float>, enabled: Boolean, onChange: (Float) -> Unit) {
              Text(title, style = MaterialTheme.typography.titleSmall)
              Slider(value = value, onValueChange = onChange, valueRange = range, enabled = enabled)
          }

          @Composable
          fun App() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var uri by remember { mutableStateOf<Uri?>(null) }
              var mode by remember { mutableIntStateOf(0) }
              var shape by remember { mutableIntStateOf(0) }
              var strength by remember { mutableFloatStateOf(0.9f) }
              var pad by remember { mutableFloatStateOf(0.35f) }
              var feather by remember { mutableFloatStateOf(0.25f) }
              var high by remember { mutableStateOf(true) }
              var busy by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("") }
              var progress by remember { mutableFloatStateOf(0f) }
              var result by remember { mutableStateOf<Uri?>(null) }
              var job by remember { mutableStateOf<Job?>(null) }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u ->
                  if (u != null) { uri = u; result = null; status = "ویدیو انتخاب شد" }
              }

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp),
              ) {
                  Text("سانسور خودکار چهره", style = MaterialTheme.typography.headlineSmall)
                  Button(onClick = { picker.launch("video/*") }, enabled = !busy, modifier = Modifier.fillMaxWidth()) {
                      Text(if (uri == null) "انتخاب ویدیو" else "تغییر ویدیو")
                  }
                  ChipRow("نوع سانسور", listOf("بلور نرم", "موزاییک", "شیشه مات (خشخشی)", "پارازیت", "مشکی"), mode, !busy) { mode = it }
                  ChipRow("شکل ناحیه", listOf("بیضی", "دایره", "مربع", "گوشه‌گرد"), shape, !busy) { shape = it }
                  LabeledSlider("شدت", strength, 0.3f..1.5f, !busy) { strength = it }
                  LabeledSlider("حاشیه اضافه دور صورت", pad, 0f..0.8f, !busy) { pad = it }
                  LabeledSlider("نرمی لبه", feather, 0f..0.6f, !busy) { feather = it }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Switch(checked = high, onCheckedChange = { high = it }, enabled = !busy)
                      Spacer(Modifier.width(8.dp))
                      Text("دقت بالا برای صورت‌های کوچک و دور (کندتر)")
                  }

                  if (!busy) {
                      Button(
                          onClick = {
                              val u = uri ?: return@Button
                              job = scope.launch {
                                  busy = true; result = null; progress = 0f
                                  try {
                                      result = process(ctx, u, BlurSettings(mode, shape, strength, pad, feather, high), { status = it }, { progress = it })
                                      status = "تمام شد ✅ در گالری (Movies/FaceBlur) ذخیره شد"
                                  } catch (e: CancellationException) {
                                      status = "لغو شد"; throw e
                                  } catch (e: Exception) {
                                      status = "خطا: ${e.message}"
                                  } finally { busy = false }
                              }
                          },
                          enabled = uri != null,
                          modifier = Modifier.fillMaxWidth(),
                      ) { Text("شروع پردازش خودکار") }
                  } else {
                      LinearProgressIndicator(progress = { progress }, modifier = Modifier.fillMaxWidth())
                      OutlinedButton(onClick = { job?.cancel() }, modifier = Modifier.fillMaxWidth()) { Text("لغو") }
                  }
                  if (status.isNotEmpty()) Text(status)
                  result?.let { r ->
                      Button(onClick = {
                          ctx.startActivity(
                              Intent(Intent.ACTION_VIEW).setDataAndType(r, "video/mp4")
                                  .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                      }, modifier = Modifier.fillMaxWidth()) { Text("پخش ویدیو") }
                  }
              }
          }
          ENDOFFILE_9
